# PR 과 main 푸시에서 돌리는 검사. 키를 하나도 쓰지 않는다 — DEMO 로만 돈다.
#
#   check  : typecheck → test → build   (서버 없이 끝나는 것)
#   verify : build → 서버 띄움 → /api/health 대기 → npm run verify → 서버 내림
#
# verify 는 :3000 에 떠 있는 서버에 실제로 요청을 보내 화면에 박힌 값을 읽는 검사라서,
# 서버를 띄우고 내리는 일을 이 파일이 직접 한다. 개발 서버(npm run dev)가 아니라
# 빌드 결과(npm start)를 상대로 돈다 — 실제로 내보내는 것과 같은 것을 본다.
#
# 키가 없으니 바깥 제공사를 부르지 않는다. 그래서 LIVE 어댑터(src/server/adapters/live)는
# verify 로 한 줄도 실행되지 않는다 — 그쪽은 `npm run check:parse` 와 scripts/*.test.mjs 가 본다.
#
# 이 저장소는 쫄탐일보 전용이다. 다른 프로젝트가 섞이면 npm test 의
# scripts/repoScope.test.mjs 가 여기서 막는다 (AGENTS.md 7절).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MARKET_MOOD_MODE: demo
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json 그대로 받는다. install 과 달리 잠금 파일을 고치지 않는다.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # 타입과 단위 검사를 지나도 빌드에서 깨지는 일이 있어 마지막에 둔다.
      - run: npm run build

  # PR #8 에서 가져왔다 (#8 은 #7 과 같은 일을 한 PR 이라 병합하지 않고 닫았다).
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: 서버를 띄우고 검증
        run: |
          # npm 만 끄면 next-server 가 남는다 — 새 프로세스 그룹으로 띄워 그룹째 끈다
          setsid npm start > next-start.log 2>&1 &
          SERVER_PGID=$!
          trap 'kill -- "-$SERVER_PGID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -fs -o /dev/null http://localhost:3000/api/health && break
            sleep 1
          done
          if ! curl -fs -o /dev/null http://localhost:3000/api/health; then
            echo "서버가 60초 안에 뜨지 않았습니다."
            cat next-start.log
            exit 1
          fi
          npm run verify
