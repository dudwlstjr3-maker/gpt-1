# PR 과 main 푸시에서 돌리는 검사.
#
# 여기서 돌리는 것은 서버 없이 끝나는 것들뿐이다.
#
# `npm run verify` 는 CI 에서 돌리지 않는다. :3000 에 떠 있는 서버에 실제로 요청을 보내
# 화면에 박힌 값을 읽는 검사라서, 서버를 띄우고 /api/health 가 응답할 때까지 기다리고
# 끝나면 내리는 일을 CI 가 따로 해 줘야 한다. 그 일은 지금 여기 두지 않았다.
# verify 는 각자 기계에서 `npm run dev` 를 띄워 둔 채로 돌린다 (AGENTS.md 5절).
#
# 키가 없으면 DEMO 모드라 바깥 제공사를 부르지는 않는다. 다만 그래서 LIVE 어댑터
# (src/server/adapters/live) 는 verify 로 한 줄도 실행되지 않는다 — 그쪽은
# `npm run check:parse` 와 scripts/*.test.mjs 가 본다. 그 단위 검사는 아래 npm test 에서 돈다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json 그대로 받는다. install 과 달리 잠금 파일을 고치지 않는다.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # 타입과 단위 검사를 지나도 빌드에서 깨지는 일이 있어 마지막에 둔다.
      - run: npm run build
