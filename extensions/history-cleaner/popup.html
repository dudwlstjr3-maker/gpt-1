<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기록 지우개</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>기록 지우개</h1>
    <label class="switch" title="자동 삭제 켜기/끄기">
      <input type="checkbox" id="enabled">
      <span aria-hidden="true"></span>
      <span class="sr">자동 삭제</span>
    </label>
  </header>

  <section class="status">
    <dl>
      <dt>마지막 삭제</dt><dd id="last">아직 없음</dd>
      <dt>다음 자동 삭제</dt><dd id="next">—</dd>
    </dl>
    <button id="clear" type="button">지금 지우기</button>
    <p class="hint" id="summary"></p>
  </section>

  <section>
    <h2>언제</h2>
    <label class="row">
      <span>주기</span>
      <select id="interval">
        <option value="0">주기 삭제 안 함</option>
        <option value="15">15분마다</option>
        <option value="30">30분마다</option>
        <option value="60">1시간마다</option>
        <option value="180">3시간마다</option>
        <option value="360">6시간마다</option>
        <option value="720">12시간마다</option>
        <option value="1440">하루마다</option>
      </select>
    </label>
    <label class="check">
      <input type="checkbox" id="onClose">
      <span>브라우저를 닫으면 지우기
        <small>창을 모두 닫을 때 지우고, 그때 다 못 끝냈을 수 있어 다음에 켤 때 한 번 더 지웁니다.</small>
      </span>
    </label>
  </section>

  <section>
    <h2>무엇을</h2>
    <label class="row">
      <span>방문 기록</span>
      <select id="keep">
        <option value="0">전부 지우기</option>
        <option value="60">최근 1시간은 남기기</option>
        <option value="1440">최근 1일은 남기기</option>
        <option value="10080">최근 7일은 남기기</option>
        <option value="43200">최근 30일은 남기기</option>
      </select>
    </label>
    <p class="sub">함께 지울 것 <small>(기간과 상관없이 전부)</small></p>
    <label class="check"><input type="checkbox" data-extra="downloads"><span>다운로드 목록 <small>파일은 그대로 둡니다</small></span></label>
    <label class="check"><input type="checkbox" data-extra="cache"><span>캐시된 이미지·파일</span></label>
    <label class="check"><input type="checkbox" data-extra="cookies"><span>쿠키 <small>사이트 로그인이 풀립니다</small></span></label>
    <label class="check"><input type="checkbox" data-extra="formData"><span>양식 자동완성 데이터</span></label>
  </section>

  <section>
    <h2>바로 지울 사이트</h2>
    <p class="hint">여기 적은 사이트는 방문하는 즉시 기록에서 지웁니다. 한 줄에 하나, 하위 주소도 포함됩니다.</p>
    <textarea id="domains" rows="4" spellcheck="false" placeholder="youtube.com&#10;news.example.com"></textarea>
    <div class="actions">
      <span class="hint" id="domainsNote"></span>
      <button id="saveDomains" type="button" class="secondary" disabled>저장</button>
    </div>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
